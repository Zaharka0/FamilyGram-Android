name: Android APK

# FamilyGram: manual APK build.
# Needs two repository secrets: API_ID and API_HASH
# (Settings -> Secrets and variables -> Actions).
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a stable FamilyGram APK release (APK published to GitHub Releases for in-app updates)"
        type: boolean
        default: true
      abis:
        description: "CPU architectures to build (arm64-v8a fits almost every modern phone)"
        type: choice
        default: arm64-v8a
        options:
          - arm64-v8a
          - armeabi-v7a
          - "armeabi-v7a, arm64-v8a"
          - "armeabi-v7a, arm64-v8a, x86, x86_64"

permissions:
  contents: read

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check API credentials.
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "::error::Add repository secrets API_ID and API_HASH (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          case "$API_ID" in (*[!0-9]*) echo "::error::API_ID must be a number."; exit 1;; esac

      - name: Free up disk space.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v5
        name: JDK 17.
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK and NDK.
        run: |
          set -x
          # Own SDK folder: does not depend on what the runner image ships.
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o "$RUNNER_TEMP/cmdtools.zip" https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          unzip -q "$RUNNER_TEMP/cmdtools.zip" -d "$RUNNER_TEMP/cmdtools"
          mv "$RUNNER_TEMP/cmdtools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          java -version
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME" "$ANDROID_HOME/ndk"

      - name: Insert API credentials and ABI list.
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          ABIS: ${{ inputs.abis }}
        run: |
          B=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i "s|public static int APP_ID = 0;.*|public static int APP_ID = ${API_ID};|" $B
          sed -i "s|public static String APP_HASH = \"\";.*|public static String APP_HASH = \"${API_HASH}\";|" $B
          grep -c "APP_ID = ${API_ID};" $B

          LIST=$(echo "$ABIS" | tr -d ' ' | sed 's/,/", "/g; s/^/"/; s/$/"/')
          sed -i "s|abiFilters \"armeabi-v7a\", \"arm64-v8a\", \"x86\", \"x86_64\"|abiFilters ${LIST}|" TMessagesProj_App/build.gradle
          grep -n "abiFilters" TMessagesProj_App/build.gradle

      - name: Set monotonic FamilyGram build code
        run: |
          BUILD_CODE=$((9000 + GITHUB_RUN_NUMBER))
          sed -i "s/^APP_VERSION_CODE=.*/APP_VERSION_CODE=$BUILD_CODE/" gradle.properties

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build APK.
        run: ./gradlew --no-daemon --stacktrace :TMessagesProj_App:assembleAfatRelease

      - name: Collect APK.
        run: |
          mkdir apk
          find TMessagesProj_App/build/outputs/apk -name '*.apk' -exec cp -v {} apk/ \;
          ls -lh apk

      - uses: actions/upload-artifact@v7
        name: Upload APK.
        with:
          name: FamilyGram-apk
          path: apk/*.apk
          retention-days: 14

  release:
    if: ${{ inputs.publish_release }}
    needs: apk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: FamilyGram-apk
          path: apk
      - name: Publish stable APK release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(cat familygram/VERSION)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then exit 1; fi
          # The afat flavor uses base code * 10 + 9. A unique tag lets in-app updates
          # distinguish rebuilds without pretending to change the Telegram base version.
          APK_CODE=$(((9000 + GITHUB_RUN_NUMBER) * 10 + 9))
          TAG="familygram-$VERSION-b$APK_CODE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" apk/*.apk --clobber
          else
            gh release create "$TAG" apk/*.apk --target "$GITHUB_SHA" --title "FamilyGram $VERSION · build $APK_CODE" --notes-file familygram/CHANGELOG.md
          fi
